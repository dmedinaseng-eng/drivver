default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "") %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>

development:
  <<: *default
  database: drivver_os_development

test:
  <<: *default
  database: drivver_os_test

production:
  <<: *default
  database: drivver_os_production
  username: drivver
  password: <%= ENV["DRIVVER_DATABASE_PASSWORD"] %>